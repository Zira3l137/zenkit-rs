[package]
name = "zenkit-rs"
description = "Pure Rust reader for ZenGin (Gothic, Gothic II) asset formats, ported from ZenKit"
keywords = ["gothic", "zengin", "gamedev", "parser"]
categories = ["game-development", "parser-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "zenkit"

[features]
default = ["vfs", "archive", "material", "texture", "mesh", "mrm", "model", "morph", "animation", "model-script", "parallel"]
vfs = ["dep:time"]
mmap = ["vfs", "dep:memmap2"]
archive = ["dep:hex"]
material = ["archive"]
texture = ["dep:texpresso"]
mesh = ["material", "texture"]
mrm = ["material"]
model = ["mrm"]
morph = ["mrm"]
animation = []
model-script = ["dep:bitflags"]
parallel = ["dep:rayon", "texpresso?/rayon"]
# Also emits every message as a `log` record, for applications that use `log` instead of `tracing`.
log = ["tracing/log"]

[dependencies]
bitflags = { version = "2", optional = true }
hex = { version = "0.4", optional = true }
glam = { version = "0.34", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }
memmap2 = { version = "0.9", optional = true }
rayon = { version = "1.12", optional = true }
texpresso = { version = "2", optional = true }
time = { version = "0.3", default-features = false, features = ["std"], optional = true }
