[package]
name = "zenkit-rs-texture"
description = "Reader and writer for ZenGin textures (.TEX), converting every pixel format to and from RGBA8"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
# Decodes and encodes large DXT textures on several threads.
parallel = ["texpresso/rayon"]

[dependencies]
zenkit-rs-core.workspace = true
texpresso.workspace = true
tracing.workspace = true
zerocopy.workspace = true

[lints]
workspace = true
