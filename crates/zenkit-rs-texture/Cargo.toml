[package]
name = "zenkit-rs-texture"
description = "Reader for ZenGin textures (.TEX), with decoding of every pixel format to RGBA8"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
# Decodes large DXT textures on several threads.
parallel = ["texpresso/rayon"]

[dependencies]
zenkit-rs-core.workspace = true
texpresso.workspace = true
zerocopy.workspace = true
