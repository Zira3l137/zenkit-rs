[package]
name = "zenkit-rs-world"
description = "Reader for ZenGin worlds (.ZEN): the world mesh, BSP tree, way-net and every VOB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
# Reads a world's mesh and BSP tree alongside its VOBs.
parallel = ["dep:rayon"]

[dependencies]
zenkit-rs-archive.workspace = true
zenkit-rs-core.workspace = true
zenkit-rs-material.workspace = true
zenkit-rs-mesh.workspace = true
rayon = { workspace = true, optional = true }
tracing.workspace = true
zerocopy.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[lints]
workspace = true
