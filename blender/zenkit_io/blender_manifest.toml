schema_version = "1.0.0"

id = "zenkit_io"
version = "0.1.0"
name = "ZenKit Import/Export"
tagline = "Import and export Gothic textures, meshes and models"
maintainer = "Zira3l137 <raulbairamov2002@gmail.com>"
type = "add-on"
website = "https://github.com/Zira3l137/zenkit-rs"

blender_version_min = "4.2.0"
