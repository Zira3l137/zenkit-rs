[package]
name = "zenkit-py"
description = "Python bindings to zenkit-rs for the Blender extension"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "zenkit_py"
crate-type = ["cdylib"]

[dependencies]
# The stable ABI of Python 3.11 and later: one build serves Blender 4.2 to 5.0 (Python 3.11) and
# 5.1 on (Python 3.13).
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
zenkit = { package = "zenkit-rs", path = "../crates/zenkit-rs", default-features = false, features = [
    "vfs",
    "texture",
    "mesh",
    "mrm",
    "model",
    "parallel",
] }

# Built on its own with maturin, outside the library's workspace.
[workspace]

[profile.release]
lto = true
codegen-units = 1
